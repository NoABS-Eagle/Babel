<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Babel{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0d0d1a;
      --surface: #161628;
      --card:    #1e1e36;
      --border:  #2a2a4a;
      --text:    #cccccc;
      --muted:   #666688;
      --dim:     #666688;
      --accent:  #4488ff;
      --green:   #44cc88;
      --yellow:  #cccc44;
      --red:     #cc4444;
      --eagle:   #ff8844;
      --kicad:   #44bbff;
      --altium:  #bb44ff;
    }
    body { background: var(--bg); color: var(--text); font: 14px/1.5 'Consolas', 'Monaco', monospace; }
    a    { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex; align-items: center; gap: 16px;
    }
    header h1 { font-size: 18px; color: var(--accent); letter-spacing: 2px; }
    header h1 a { color: inherit; }
    header h1 a:hover { text-decoration: none; opacity: 0.8; }
    .header-sep { color: var(--border); }
    .header-lib { color: var(--muted); font-size: 12px; }
    .header-lib a { color: var(--muted); }
    .header-lib a:hover { color: var(--text); text-decoration: none; }

    main { padding: 24px; max-width: 1400px; margin: 0 auto; }

    /* ── Cards ── */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 6px; padding: 16px; margin-bottom: 16px;
    }
    .card-title {
      color: var(--accent); font-size: 13px; font-weight: bold;
      margin-bottom: 12px; border-bottom: 1px solid var(--border);
      padding-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
    }

    /* ── Tables ── */
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; color: var(--dim); font-weight: normal;
         padding: 6px 12px; border-bottom: 1px solid var(--border);
         font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
    td { padding: 7px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:hover td { background: rgba(68,136,255,0.06); }

    /* ── Badges ── */
    .badge { display: inline-block; padding: 2px 7px; border-radius: 10px;
             font-size: 11px; background: var(--border); color: var(--dim); }
    .badge.ok   { background: rgba(68,204,136,0.15); color: var(--green); }
    .badge.warn { background: rgba(204,196,68,0.15);  color: var(--yellow); }
    .badge.err  { background: rgba(204,68,68,0.15);   color: var(--red); }

    /* ── Workspace ── */
    .path-form { display: flex; gap: 8px; }
    .path-input {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      border-radius: 4px; padding: 8px 12px; color: var(--text);
      font: inherit; outline: none;
    }
    .path-input:focus { border-color: var(--accent); }
    .btn {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; padding: 8px 16px; color: var(--text);
      font: inherit; cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.primary:hover { opacity: 0.85; color: #fff; }

    .error-msg { color: var(--red); margin-top: 8px; font-size: 13px; }
    .empty-msg { color: var(--muted); font-size: 13px; padding: 8px 0; }

    /* ── Artifact grid ── */
    .artifact-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .artifact-btn {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; padding: 10px 14px;
      text-decoration: none; color: var(--text);
      cursor: pointer; font: inherit; transition: border-color 0.15s;
      min-width: 180px;
    }
    .artifact-btn:hover { border-color: var(--accent); color: var(--text); text-decoration: none; }
    .artifact-btn.eagle  { border-left: 3px solid var(--eagle); }
    .artifact-btn.kicad  { border-left: 3px solid var(--kicad); }
    .artifact-btn.altium { border-left: 3px solid var(--altium); }
    .artifact-btn.passive { cursor: default; }
    .artifact-btn.passive:hover { border-color: var(--border); }
    .artifact-btn.disabled { opacity: 0.5; cursor: not-allowed; }
    .artifact-btn.disabled:hover { border-left-color: currentColor; }
    .artifact-btn.selected { border-color: var(--green); background: rgba(68,204,136,0.07); }
    .artifact-icon { font-size: 18px; flex-shrink: 0; }
    .artifact-name { flex: 1; font-size: 13px; word-break: break-all; }

    /* ── Layout helpers ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    @media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

    .fp-card { display: flex; gap: 16px; align-items: flex-start; }
    .fp-card .svg-wrap { flex-shrink: 0; }
    .fp-card .fp-table { flex: 1; }

    .attr-name  { color: var(--dim); }
    .attr-value { color: var(--text); }
    nav.back { margin-bottom: 16px; }
    h2.page-title { font-size: 20px; color: var(--accent); margin-bottom: 16px; }

    /* ── Save As ── */
    .save-as-card { margin-bottom: 16px; }
    .save-as-row  { display: flex; flex-wrap: wrap; gap: 8px; }
    .save-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface);
      text-decoration: none; color: var(--text);
      font: inherit; font-size: 13px; cursor: pointer;
      transition: border-color 0.15s, opacity 0.15s;
      white-space: nowrap;
    }
    .save-btn:hover { text-decoration: none; }
    .save-icon { font-size: 14px; }
    .save-label { font-weight: bold; }
    .save-ext   { color: var(--muted); font-size: 11px; }
    .save-btn.swift  { border-left: 3px solid var(--accent); }
    .save-btn.swift:hover  { border-color: var(--accent);  color: var(--accent); }
    .save-btn.eagle  { border-left: 3px solid var(--eagle); }
    .save-btn.eagle:hover  { border-color: var(--eagle);   color: var(--eagle); }
    .save-btn.kicad  { border-left: 3px solid var(--kicad); }
    .save-btn.altium { border-left: 3px solid var(--altium); }
    .save-btn.disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <h1><a href="/">BABEL</a></h1>
    {% if lib_name %}
    <span class="header-sep">/</span>
    <span class="header-lib"><a href="/library">{{ lib_name }}</a></span>
    {% endif %}
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
